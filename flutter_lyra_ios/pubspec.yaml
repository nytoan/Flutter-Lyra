name: flutter_lyra_ios
description: iOS implementation of the flutter_lyra plugin
version: 0.6.2
homepage: https://github.com/bamlab/Flutter-Lyra
repository: https://github.com/bamlab/Flutter-Lyra

environment:
  sdk: ">=2.19.0 <3.0.0"
  flutter: ">=3.0.0"

flutter:
  plugin:
    implements: flutter_lyra
    platforms:
      ios:
        pluginClass: FlutterLyraPlugin
        dartPluginClass: FlutterLyraIOS

dependencies:
  flutter:
    sdk: flutter
  flutter_lyra_platform_interface:
    git:
      url: https://github.com/nytoan/Flutter-Lyra.git
      ref: develop
      path: flutter_lyra_platform_interface
dev_dependencies:
  analyzer: ^4.7.0
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.0.0
